<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Death Roulette 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Press Start 2P','Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}

#blocker{position:fixed;inset:0;background:rgba(0,0,0,0.93);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:20px}
#blocker h1{color:#a00;font-size:clamp(20px,5.5vw,42px);text-shadow:0 0 15px #800,2px 2px 0 #300;margin-bottom:12px;letter-spacing:2px;text-align:center}
#blocker p{color:#777;font-size:clamp(11px,2.8vw,16px);margin:3px 0;text-align:center}

.big-btn{
  padding:clamp(16px,4vw,22px) clamp(32px,8vw,56px);
  background:linear-gradient(180deg,#772222,#551111);color:#daa;
  border:3px solid #993333;font-size:clamp(14px,3.5vw,22px);
  font-family:inherit;letter-spacing:2px;cursor:pointer;
  box-shadow:0 5px 15px rgba(80,0,0,0.5),inset 0 1px 0 rgba(255,200,200,0.15);
  text-shadow:1px 1px 2px #000;border-radius:4px;
  -webkit-tap-highlight-color:transparent;
}
.big-btn:active{transform:scale(0.95);background:linear-gradient(180deg,#993333,#772222)}

#dialogue-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:110;display:none;align-items:flex-end;justify-content:center;padding:0 10px max(30px,env(safe-area-inset-bottom)) 10px}
#dialogue-box{background:#111;border:2px solid #553333;width:100%;max-width:450px;padding:18px 16px;position:relative;border-radius:4px}
#dialogue-portrait{position:absolute;top:-40px;left:12px;width:44px;height:44px;background:#1a1a1a;border:2px solid #664444;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:2px}
#dialogue-name{color:#cc5555;font-size:clamp(12px,3vw,16px);margin-bottom:8px}
#dialogue-text{color:#ccc;font-size:clamp(12px,3vw,16px);line-height:2;min-height:50px;white-space:pre-wrap}
#dialogue-next{display:block;margin-top:12px;padding:12px 28px;background:linear-gradient(180deg,#553333,#331111);color:#caa;border:2px solid #774444;font-family:inherit;font-size:clamp(11px,2.8vw,15px);cursor:pointer;float:right;border-radius:3px;-webkit-tap-highlight-color:transparent}

#coin-hud{position:fixed;top:8px;right:8px;z-index:10;background:rgba(0,0,0,0.8);border:2px solid #554400;padding:6px 12px;pointer-events:none;display:none;border-radius:3px}
.coin-icon{display:inline-block;width:14px;height:14px;background:radial-gradient(circle at 38% 32%,#ffdd44,#aa8811);border-radius:50%;vertical-align:middle;margin-right:5px;box-shadow:0 0 4px rgba(200,150,0,0.4)}
#coin-val{color:#ccaa22;font-size:clamp(11px,2.8vw,17px);vertical-align:middle}

/* NAV ARROWS on screen edges - used in room AND overlays */
.nav-arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:55;
  width:clamp(44px,11vw,60px);height:clamp(90px,22vh,130px);
  background:rgba(20,15,10,0.75);color:rgba(220,200,170,0.9);
  border:2px solid rgba(150,120,80,0.5);
  font-size:clamp(22px,5.5vw,34px);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;font-family:inherit;
  box-shadow:0 0 10px rgba(0,0,0,0.5),inset 0 0 8px rgba(100,80,50,0.1);
}
.nav-arrow:active{background:rgba(80,60,30,0.85);color:#ffe8c0;border-color:rgba(200,160,80,0.7)}
#nav-arrow-left{left:0;border-radius:0 10px 10px 0;border-left:none}
#nav-arrow-right{right:0;border-radius:10px 0 0 10px;border-right:none}

/* ROULETTE */
#roulette-overlay{position:fixed;inset:0;z-index:20;display:none;flex-direction:column}
#roulette-top{flex:1;pointer-events:none}
#gauge-wrap{width:88%;max-width:380px;margin:0 auto 10px}
#gauge-container{width:100%;height:28px;background:#0a0a0a;border:2px solid #3a3a3a;position:relative;overflow:hidden;border-radius:3px}
#gauge-layers{position:absolute;left:0;top:0;bottom:0;right:0}
.gauge-layer{position:absolute;left:0;top:0;bottom:0;height:100%;transition:width 0.05s linear}
#gauge-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(7px,1.8vw,10px);z-index:5;text-shadow:0 0 4px #000,1px 1px 0 #000}
#gauge-glow{position:absolute;inset:0;pointer-events:none;border-radius:3px;z-index:3}

#roulette-controls{display:flex;flex-direction:column;align-items:center;padding-bottom:max(16px,env(safe-area-inset-bottom));pointer-events:auto}
#push-btn{
  width:clamp(140px,40vw,200px);height:clamp(80px,20vw,110px);border-radius:8px;
  background:linear-gradient(180deg,#664444,#442222 50%,#331818 100%);
  border:4px solid #885555;color:#cc9999;font-family:inherit;
  font-size:clamp(11px,2.8vw,16px);line-height:1.5;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 6px 20px rgba(60,0,0,0.6),inset 0 2px 4px rgba(255,200,200,0.1),inset 0 -4px 10px rgba(0,0,0,0.5);
  position:relative;-webkit-tap-highlight-color:transparent;text-align:center;
  transition:background 0.05s,transform 0.05s;
}
#push-btn.pressed{transform:scale(0.93);background:linear-gradient(180deg,#886666,#664444 50%,#553333 100%);color:#ffddcc}
#push-btn.fever-active{
  background:linear-gradient(180deg,#ccaa44,#997722 50%,#775511 100%)!important;
  border-color:#ddcc66!important;box-shadow:0 0 30px rgba(200,150,0,0.5)!important;color:#fff!important;
}

#roulette-btn-row{display:flex;gap:12px;margin-top:12px;align-items:center}
.r-btn{padding:clamp(10px,2.5vw,14px) clamp(20px,5vw,30px);font-family:inherit;font-size:clamp(8px,2vw,12px);cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent}
#fever-btn{background:linear-gradient(180deg,#775500,#443300);border:2px solid #aa7700;color:#ffcc44;display:none;box-shadow:0 3px 8px rgba(100,70,0,0.4)}
#fever-btn:active{background:#886600}
#fever-btn.empty{opacity:0.3}
#roulette-speed-info{color:#666;font-size:clamp(8px,2vw,11px);margin-top:6px;text-align:center;pointer-events:none}

/* CENTER COUNTDOWN */
#center-countdown{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:18;
  pointer-events:none;display:none;text-align:center;
}
#countdown-main{color:#cc2222;font-size:clamp(48px,14vw,96px);text-shadow:0 0 30px #aa0000,3px 3px 0 #330000;line-height:1}
#countdown-label{color:#cc8888;font-size:clamp(10px,2.5vw,16px);margin-top:4px}

/* FEVER COUNTDOWN */
#fever-countdown{
  position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);z-index:19;
  pointer-events:none;display:none;text-align:center;
}
#fever-cd-title{color:#ffcc00;font-size:clamp(14px,3.5vw,22px);text-shadow:0 0 15px #cc8800}
#fever-cd-time{color:#ffee44;font-size:clamp(36px,10vw,64px);text-shadow:0 0 25px #ccaa00,2px 2px 0 #442200;line-height:1.2}

/* SHOP */
#shop-overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.92)}
#shop-panel{background:#0c0a04;border:3px solid #665522;padding:0;width:92%;max-width:400px;max-height:88vh;overflow-y:auto;border-radius:4px;position:relative}
#shop-header{background:linear-gradient(180deg,#332200,#1a1100);padding:14px 12px;text-align:center;border-bottom:2px solid #554400;position:relative}
#shop-header h2{color:#ddaa22;font-size:clamp(13px,3.2vw,18px);letter-spacing:1px}
#shop-header-deco{display:flex;justify-content:center;gap:6px;margin-top:6px}
#shop-header-deco span{display:inline-block;width:8px;height:8px;border-radius:50%;box-shadow:0 0 4px currentColor}
#shop-coins{color:#ccaa22;font-size:clamp(11px,2.8vw,15px);padding:8px 12px;text-align:center;border-bottom:1px solid #2a2200;background:#111100}
#shop-items{padding:8px}
.shop-item{
  display:flex;align-items:center;padding:12px 10px;margin:6px 0;
  background:linear-gradient(180deg,#181808,#101004);
  border:2px solid #2a2a10;cursor:pointer;border-radius:3px;
  -webkit-tap-highlight-color:transparent;transition:border-color 0.1s;
}
.shop-item:active{border-color:#665500;background:#222210}
.shop-item.cant-afford{opacity:0.25;pointer-events:none}
.shop-item-icon{
  width:clamp(40px,10vw,52px);height:clamp(40px,10vw,52px);
  border:2px solid #444;margin-right:10px;flex-shrink:0;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4vw,24px);
  image-rendering:pixelated;
}
.shop-item-info{flex:1;min-width:0}
.shop-item-name{color:#ddd;font-size:clamp(10px,2.5vw,14px)}
.shop-item-desc{color:#888;font-size:clamp(8px,2vw,11px);margin-top:3px}
.shop-item-level{color:#448844;font-size:clamp(8px,2vw,11px);margin-top:2px}
.shop-item-cost{color:#ccaa00;font-size:clamp(11px,2.8vw,16px);white-space:nowrap;margin-left:8px;text-shadow:1px 1px 0 #000}


/* CLEAR */
#clear-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.6);gap:20px}
#clear-overlay h2{color:#33cc55;font-size:clamp(18px,4.5vw,32px);text-shadow:0 0 20px #33cc55,2px 2px 0 #003300;margin-bottom:8px;text-align:center}
.clear-btn{
  padding:clamp(14px,3.5vw,20px) clamp(24px,6vw,44px);
  font-family:inherit;font-size:clamp(12px,3vw,18px);
  cursor:pointer;border-radius:4px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  -webkit-tap-highlight-color:transparent;
}
#escape-btn{background:linear-gradient(180deg,#338833,#225522);color:#aaffaa;border:3px solid #55cc55;animation:ePulse 1.2s infinite}
#continue-btn{background:linear-gradient(180deg,#884422,#553311);color:#ffcc88;border:3px solid #cc7744}
@keyframes ePulse{50%{box-shadow:0 0 40px rgba(50,200,50,0.6),0 5px 15px rgba(0,0,0,0.4)}}

/* CASINO */
#casino-overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.92)}
#casino-panel{background:#0a0a04;border:3px solid #446622;padding:20px;width:92%;max-width:400px;border-radius:6px;text-align:center}
#casino-panel h2{color:#44cc44;font-size:clamp(14px,3.5vw,20px);margin-bottom:12px}
#casino-info{color:#aaa;font-size:clamp(10px,2.5vw,14px);margin-bottom:10px;line-height:1.8}
#casino-bet-info{color:#ccaa22;font-size:clamp(12px,3vw,16px);margin:12px 0}
#casino-wheel-canvas{width:200px;height:200px;margin:16px auto;display:block}
#casino-result{color:#fff;font-size:clamp(14px,3.5vw,20px);margin:12px 0;min-height:30px}
.casino-btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.casino-btn{padding:clamp(12px,3vw,16px) clamp(20px,5vw,32px);font-family:inherit;font-size:clamp(10px,2.5vw,14px);cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
#casino-red{background:linear-gradient(180deg,#993333,#662222);border:2px solid #cc4444;color:#ffaaaa}
#casino-black{background:linear-gradient(180deg,#333,#111);border:2px solid #666;color:#ccc}
#casino-leave{background:linear-gradient(180deg,#444,#222);border:2px solid #666;color:#aaa;margin-top:8px}

/* GAME OVER */
#game-over{position:fixed;inset:0;background:rgba(0,0,0,0.96);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;padding:20px}
#game-over h1{font-size:clamp(22px,6vw,48px);margin-bottom:14px;text-shadow:2px 2px 0 #000}
#game-over p{color:#777;font-size:clamp(10px,2.5vw,16px);margin:3px 0;text-align:center}

#fall-text{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);color:#cc3333;font-size:clamp(14px,4vw,30px);z-index:50;display:none;text-shadow:0 0 15px #aa0000,2px 2px 0 #330000;text-align:center;pointer-events:none;line-height:1.8}
#fever-flash{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0}
#game-container{position:relative;width:100vw;height:100vh;overflow:hidden}
#game-container.shake{animation:shk 0.06s infinite}
@keyframes shk{0%{transform:translate(1px,1px)}25%{transform:translate(-1px,-1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.coin-popup{position:fixed;pointer-events:none;z-index:12;color:#ffdd00;font-size:clamp(12px,3vw,18px);text-shadow:0 0 8px #aa8800,1px 1px 0 #000;animation:coinUp 0.8s ease-out forwards}
@keyframes coinUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
</style>
</head>
<body>

<div id="blocker">
  <h1>DEATH ROULETTE</h1>
  <p>監獄からの脱出ゲーム</p>
  <p style="margin-top:8px;color:#555">ボタンを連打してルーレットを回せ</p>
  <button class="big-btn" id="start-btn">GAME START</button>
</div>

<div id="dialogue-overlay">
  <div id="dialogue-box">
    <div id="dialogue-portrait">👁</div>
    <div id="dialogue-name">???</div>
    <div id="dialogue-text"></div>
    <button id="dialogue-next">▶</button>
  </div>
</div>

<div id="coin-hud"><span class="coin-icon"></span><span id="coin-val">0</span></div>

<!-- NAV ARROWS -->
<button class="nav-arrow" id="nav-arrow-left">◀</button>
<button class="nav-arrow" id="nav-arrow-right">▶</button>

<div id="center-countdown">
  <div id="countdown-main">30</div>
  <div id="countdown-label">残り時間</div>
</div>

<div id="fever-countdown">
  <div id="fever-cd-title">フィーバータイム</div>
  <div id="fever-cd-time">10</div>
</div>

<div id="roulette-overlay">
  <div id="roulette-top"></div>
  <div id="roulette-controls">
    <div id="gauge-wrap"><div id="gauge-container"><div id="gauge-layers"></div><div id="gauge-label">0 RPS</div><div id="gauge-glow"></div></div></div>
    <div id="push-btn">ボタンを<br>連打</div>
    <div id="roulette-btn-row">
      <button class="r-btn" id="fever-btn">FEVER x0</button>
    </div>
    <div id="roulette-speed-info"></div>
  </div>
</div>

<div id="shop-overlay">
  <div id="shop-panel">
    <div id="shop-header">
      <h2>ITEM SHOP</h2>
      <div id="shop-header-deco">
        <span style="color:#44aa44"></span><span style="color:#4488cc"></span>
        <span style="color:#aa44cc"></span><span style="color:#ccaa44"></span>
      </div>
    </div>
    <div id="shop-coins">所持金: <span id="shop-coin-val">0</span> G</div>
    <div id="shop-items"></div>
  </div>
</div>

<div id="fever-flash"></div>
<div id="fall-text"></div>

<div id="clear-overlay">
  <h2>DOOR UNLOCKED</h2>
  <button class="clear-btn" id="escape-btn">脱出する</button>
  <button class="clear-btn" id="continue-btn">まだ回す</button>
</div>

<div id="casino-overlay">
  <div id="casino-panel">
    <h2>CASINO ROULETTE</h2>
    <div id="casino-info"></div>
    <div id="casino-bet-info"></div>
    <canvas id="casino-wheel-canvas" width="200" height="200"></canvas>
    <div id="casino-result"></div>
    <div class="casino-btn-row" id="casino-btns">
      <button class="casino-btn" id="casino-red">赤に賭ける</button>
      <button class="casino-btn" id="casino-black">黒に賭ける</button>
    </div>
    <button class="casino-btn" id="casino-leave">やめる</button>
  </div>
</div>

<div id="game-over">
  <h1 id="result-title"></h1>
  <p id="result-msg"></p>
  <p id="result-stats"></p>
  <button class="big-btn" style="margin-top:18px" id="retry-btn">RETRY</button>
</div>

<div id="game-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

const MAX_UPGRADE_LEVEL=10;
const FEVER_DURATION=10;

const G={
  started:false,ended:false,mode:'room',
  totalSpins:0,targetSpins:10,
  timeLimit:300,timeRemaining:300,
  coins:0,
  rouletteSpeed:0,rouletteAngle:0,totalRotation:0,
  lastTapTime:0,
  pushing:false, // only true during fever (hold mode)
  feverActive:false,feverTimer:0,feverStocks:0,feverTotalBought:0,
  fallPhase:0,fallY:1.6,fallVel:0,fallTimer:0,
  clearPhase:0,clearTimer:0,
  continued:false,
  casinoUnlocked:false,
  currentView:'center',
  // Views order for arrow navigation
  views:['left','center','right'],
  upgrades:{
    accel:   {level:0,baseCost:5,   name:'加速力UP',   desc:'加速度が上がる',   icon:'accel'},
    maxSpeed:{level:0,baseCost:20,  name:'速度上限UP', desc:'最大速度が上がる', icon:'speed'},
    coinVal: {level:0,baseCost:500, name:'金額UP',     desc:'獲得コイン増加',   icon:'coin'},
    lucky:   {level:0,baseCost:20,  name:'フィーバー', desc:'FEVER +1',        icon:'fever'},
  },
  getAccel(){const lv=Math.min(this.upgrades.accel.level,MAX_UPGRADE_LEVEL);return 0.3*Math.pow(2,lv)},
  getMaxSpeed(){const lv=Math.min(this.upgrades.maxSpeed.level,MAX_UPGRADE_LEVEL);return 1*Math.pow(2,lv)},
  getCoinMult(){const lv=Math.min(this.upgrades.coinVal.level,MAX_UPGRADE_LEVEL);return Math.pow(2,lv)},
  getCost(k){const u=this.upgrades[k];if(k==='lucky')return Math.floor(u.baseCost*Math.pow(1.5,this.feverTotalBought));return Math.floor(u.baseCost*Math.pow(1.5,u.level))},
};

// ========== THREE ==========
const container=document.getElementById('game-container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0e0c0a);
scene.fog=new THREE.FogExp2(0x0e0c0a,0.025);

const isPortrait=()=>innerWidth<innerHeight;
function getFOV(){return isPortrait()?85:70}

const camera=new THREE.PerspectiveCamera(getFOV(),innerWidth/innerHeight,0.1,50);
camera.position.set(0,1.6,0);

const rouletteCam=new THREE.PerspectiveCamera(isPortrait()?70:50,innerWidth/innerHeight,0.1,50);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.7;
container.appendChild(renderer.domElement);

let yaw=0,pitch=0;

// ========== VIEW SYSTEM ==========
const VIEW_ANGLES={left:Math.PI/2,center:0,right:-Math.PI/2,back:Math.PI};
let targetYaw=0;
G.viewTransitioning=false;

function setView(view){
  G.currentView=view;
  targetYaw=VIEW_ANGLES[view];
  G.viewTransitioning=true;
  updateNavArrows();
}

function updateNavArrows(){
  if(!G.started||G.ended){hideNavArrows();return}
  const views=G.views;
  const idx=views.indexOf(G.currentView);
  const leftA=document.getElementById('nav-arrow-left');
  const rightA=document.getElementById('nav-arrow-right');
  leftA.style.display=idx>0?'flex':'none';
  rightA.style.display=idx<views.length-1?'flex':'none';
}

function navLeft(){
  const views=G.views;
  const idx=views.indexOf(G.currentView);
  if(idx>0)setView(views[idx-1]);
}
function navRight(){
  const views=G.views;
  const idx=views.indexOf(G.currentView);
  if(idx<views.length-1)setView(views[idx+1]);
}

let autoOpenTimer=null;
function handleViewAction(){
  // Auto-open shop/casino/roulette 0.5s after transition completes
  if(autoOpenTimer){clearTimeout(autoOpenTimer);autoOpenTimer=null}
  autoOpenTimer=setTimeout(()=>{
    if(!G.started||G.ended||G.viewTransitioning)return;
    if(G.mode!=='room')return;
    const v=G.currentView;
    if(v==='center'){enterRoulette()}
    else if(v==='right'){openShop()}
    else if(v==='back'&&G.casinoUnlocked){openCasino()}
    // left (door) = just view, no auto-open needed
  },400);
}

function canNav(){return G.started&&!G.ended&&!G.viewTransitioning&&(G.clearPhase===0||(G.clearPhase>0&&G.continued))&&(G.mode==='room'||G.mode==='roulette'||G.mode==='shop'||(G.mode==='casino'&&!casinoSpinning))}
function navFromOverlay(){
  // Close current overlay before navigating
  if(autoOpenTimer){clearTimeout(autoOpenTimer);autoOpenTimer=null}
  if(G.mode==='roulette')exitRoulette();
  else if(G.mode==='shop')closeShop();

let audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function tone(f,d,t='sine',v=0.06){
  try{
    const a=getAC(),o=a.createOscillator(),g=a.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);
  }catch(e){}
}

function sfxFall(){
  const a=getAC();
  try{
    const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(140,a.currentTime);o.frequency.exponentialRampToValueAtTime(25,a.currentTime+3.5);
    g.gain.setValueAtTime(0.1,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+4);
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=250;
    o.connect(f);f.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+4.5);
    const buf=a.createBuffer(1,a.sampleRate*3,a.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.25;
    const ns=a.createBufferSource();ns.buffer=buf;
    const ng=a.createGain();ng.gain.setValueAtTime(0,a.currentTime);ng.gain.linearRampToValueAtTime(0.07,a.currentTime+0.5);ng.gain.linearRampToValueAtTime(0.12,a.currentTime+2.5);ng.gain.exponentialRampToValueAtTime(0.001,a.currentTime+4);
    const nf=a.createBiquadFilter();nf.type='bandpass';nf.frequency.value=700;nf.Q.value=0.5;
    ns.connect(nf);nf.connect(ng);ng.connect(a.destination);ns.start();ns.stop(a.currentTime+4.5);
  }catch(e){}
}

function startDrone(){
  if(droneOn)return;droneOn=true;
  try{
    const a=getAC();
    const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=42;f.type='lowpass';f.frequency.value=110;g.gain.value=0.018;
    o.connect(f);f.connect(g);g.connect(a.destination);o.start();

  for(const t of e.changedTouches){if(t.identifier===touchId){if(!tmoved&&G.mode==='room')roomTap();touchId=null}}
}

// TAP BOOST: each tap adds a burst of speed
// At 3 taps/s, equal accel/max levels → 10s to fill gauge
// boost = TAP_BOOST * 2^accelLv, maxSpeed = 2^maxLv
// 3tps * boost * 10s = maxSpeed → TAP_BOOST = 1/30
const TAP_BOOST=1/30;

function enterRoulette(){G.mode='roulette';document.getElementById('roulette-overlay').style.display='flex';updateNavArrows();updateFeverBtn();updatePushBtnText()}
function exitRoulette(){G.mode='room';G.pushing=false;pushBtn.classList.remove('pressed');document.getElementById('roulette-overlay').style.display='none';updateNavArrows()}

  else{pushBtn.innerHTML='ボタンを<br>連打'}

function stopE(e){e.preventDefault();e.stopPropagation()}

// Tap mode: each tap = speed boost
function handlePushTap(){
  if(G.mode!=='roulette')return;
  if(G.feverActive){
    // During fever, it's hold mode - handled by push/release
    return;
  }
  // Tap boost
  G.lastTapTime=Date.now();
  const accelMult=G.getAccel()/0.3; // normalized: 2^accelLv
  const boost=TAP_BOOST*accelMult;
  const mx=G.getMaxSpeed();
  G.rouletteSpeed=Math.min(G.rouletteSpeed+boost,mx);
  sfxTap();
  // Visual feedback
  pushBtn.classList.add('pressed');
  setTimeout(()=>{if(!G.feverActive)pushBtn.classList.remove('pressed')},60);
}

// FEVER hold mode
function handlePushDown(){
  if(G.mode!=='roulette'||!G.feverActive)return;
  G.pushing=true;pushBtn.classList.add('pressed');
}
function handlePushUp(){
  G.pushing=false;pushBtn.classList.remove('pressed');
}

pushBtn.addEventListener('touchstart',e=>{

// GAUGE - Stacked/Layered progress bar
// Each layer = 1 RPS range. 0-1 = green, 1-2 = blue, 2-3 = purple, etc.
const GCOLS=['#227733','#2266aa','#7733aa','#aa2233','#aa8822','#dddddd','#44dddd','#ff66aa'];
const gaugeLayers=document.getElementById('gauge-layers');
const gaugeLbl=document.getElementById('gauge-label');
const gaugeGlow=document.getElementById('gauge-glow');
let gaugeLayerEls=[];

function ensureGaugeLayers(count){
  while(gaugeLayerEls.length<count){
    const el=document.createElement('div');
    el.className='gauge-layer';
    el.style.zIndex=gaugeLayerEls.length+1;
    el.style.background=GCOLS[Math.min(gaugeLayerEls.length,GCOLS.length-1)];
    gaugeLayers.appendChild(el);
    gaugeLayerEls.push(el);
  }
}

function updateGauge(){
  const spd=Math.abs(G.rouletteSpeed);
  const mx=G.getMaxSpeed()*(G.feverActive?2:1);
  // Each layer represents 1 RPS
  const layerSize=1; // 1 RPS per layer
  const fullLayers=Math.floor(spd/layerSize);
  const partial=(spd/layerSize)-fullLayers;
  const totalLayers=fullLayers+(partial>0.001?1:0);

  ensureGaugeLayers(Math.max(totalLayers,1));

  for(let i=0;i<gaugeLayerEls.length;i++){
    const el=gaugeLayerEls[i];
    if(i<fullLayers){
      // Full layer
      el.style.width='100%';
      el.style.display='block';
      el.style.background=GCOLS[Math.min(i,GCOLS.length-1)];
    }else if(i===fullLayers&&partial>0.001){
      // Partial (current) layer
      el.style.width=(partial*100)+'%';
      el.style.display='block';
      el.style.background=GCOLS[Math.min(i,GCOLS.length-1)];
    }else{
      el.style.display='none';
    }
  }

  if(G.feverActive){const h=(Date.now()*0.5)%360;gaugeGlow.style.boxShadow=`inset 0 0 12px hsla(${h},100%,50%,0.3)`;gaugeGlow.style.border=`1px solid hsla(${h},100%,60%,0.4)`}
  else{gaugeGlow.style.boxShadow='none';gaugeGlow.style.border='none'}
  gaugeLbl.textContent=`${spd.toFixed(1)} / ${mx.toFixed(1)} RPS`;
}

function drawItemIcon(type){
  const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  if(type==='accel'){x.fillStyle='#44cc44';x.fillRect(8,1,3,4);x.fillRect(6,4,5,2);x.fillRect(7,6,3,3);x.fillRect(5,8,5,2);x.fillRect(6,10,3,4);x.fillStyle='#66ee66';x.fillRect(9,2,1,3);x.fillRect(7,5,1,1);x.fillRect(8,7,1,2)}
  else if(type==='speed'){x.fillStyle='#4488cc';x.beginPath();x.arc(8,9,6,Math.PI,0);x.fill();x.fillStyle='#0c0a04';x.beginPath();x.arc(8,9,4,Math.PI,0);x.fill();x.fillStyle='#66bbff';x.fillRect(7,4,2,5);x.fillStyle='#aaddff';x.fillRect(8,5,1,3)}
  else if(type==='coin'){x.fillStyle='#ccaa22';x.beginPath();x.arc(8,8,6,0,Math.PI*2);x.fill();x.fillStyle='#aa8811';x.beginPath();x.arc(8,8,4.5,0,Math.PI*2);x.fill();x.fillStyle='#ccaa22';x.fillRect(7,4,2,1);x.fillRect(6,5,4,1);x.fillRect(6,6,2,1);x.fillRect(6,7,4,1);x.fillRect(8,8,2,1);x.fillRect(6,9,4,1);x.fillRect(7,10,2,1);x.fillRect(7,11,2,1)}
  else if(type==='fever'){x.fillStyle='#cc8822';x.fillRect(7,2,2,2);x.fillRect(5,4,6,2);x.fillRect(4,6,8,3);x.fillRect(5,9,6,2);x.fillRect(6,11,4,2);x.fillRect(7,13,2,1);x.fillStyle='#ffcc44';x.fillRect(7,3,2,1);x.fillRect(6,5,4,1);x.fillRect(5,7,6,2);x.fillRect(6,10,4,1);x.fillStyle='#ffee88';x.fillRect(7,6,2,2)}
  return c;
}

function renderShop(){
  document.getElementById('shop-coin-val').textContent=Math.floor(G.coins);

  for(let idx=0;idx<keys.length;idx++){
    const k=keys[idx],u=G.upgrades[k],cost=G.getCost(k),ok=G.coins>=cost;
    const isMaxed=(k!=='lucky'&&u.level>=MAX_UPGRADE_LEVEL);
    const maxedFever=k==='lucky'&&G.feverStocks>=3;
    const d=document.createElement('div');d.className='shop-item'+((ok&&!isMaxed&&!maxedFever)?'':' cant-afford');
    const iconDiv=document.createElement('div');iconDiv.className='shop-item-icon';iconDiv.style.background=iconBgs[idx];
    const ic=drawItemIcon(iconTypes[idx]);ic.style.width='100%';ic.style.height='100%';ic.style.imageRendering='pixelated';iconDiv.appendChild(ic);
    let lv=k==='lucky'?`Stock: ${G.feverStocks}/3`:`Lv.${u.level}${isMaxed?' (MAX)':''}`;
    let eff='';
    if(k==='accel')eff=`加速: ${G.getAccel().toFixed(1)} RPS/s`;
    if(k==='maxSpeed')eff=`上限: ${G.getMaxSpeed().toFixed(1)} RPS`;
    if(k==='coinVal')eff=`倍率: x${G.getCoinMult()}`;
    const infoDiv=document.createElement('div');infoDiv.className='shop-item-info';
    infoDiv.innerHTML=`<div class="shop-item-name">${u.name}</div><div class="shop-item-desc">${eff}</div><div class="shop-item-level">${lv}</div>`;
    const costDiv=document.createElement('div');costDiv.className='shop-item-cost';costDiv.textContent=(isMaxed||maxedFever)?'MAX':cost+'G';
    d.appendChild(iconDiv);d.appendChild(infoDiv);d.appendChild(costDiv);

function buyUpgrade(k){
  if(k==='lucky'&&G.feverStocks>=3)return;
  if(k!=='lucky'&&G.upgrades[k].level>=MAX_UPGRADE_LEVEL)return;
  const cost=G.getCost(k);if(G.coins<cost)return;G.coins-=cost;
  if(k==='lucky'){G.feverStocks++;G.feverTotalBought++}else G.upgrades[k].level++;
  sfxBuy();renderShop();updateCoinHUD();updateFeverBtn();
}

let casinoSpinning=false,casinoAngle=0,casinoTargetAngle=0,casinoBet='';

const casinoCtx=casinoCanvas.getContext('2d');

function drawCasinoWheel(angle){
  const cx=100,cy=100,r=90;casinoCtx.clearRect(0,0,200,200);
  for(let i=0;i<10;i++){const a1=angle+i*(Math.PI*2/10);const a2=a1+Math.PI*2/10;casinoCtx.beginPath();casinoCtx.moveTo(cx,cy);casinoCtx.arc(cx,cy,r,a1,a2);casinoCtx.closePath();casinoCtx.fillStyle=i%2===0?'#aa2222':'#222222';casinoCtx.fill();casinoCtx.strokeStyle='#444';casinoCtx.lineWidth=1;casinoCtx.stroke()}
  casinoCtx.beginPath();casinoCtx.arc(cx,cy,12,0,Math.PI*2);casinoCtx.fillStyle='#888';casinoCtx.fill();
  casinoCtx.beginPath();casinoCtx.moveTo(cx-8,6);casinoCtx.lineTo(cx+8,6);casinoCtx.lineTo(cx,20);casinoCtx.closePath();casinoCtx.fillStyle='#ffcc00';casinoCtx.fill();
}

function casinoBetAction(color){
  if(casinoSpinning||G.coins<1)return;casinoBet=color;casinoSpinning=true;
  document.getElementById('casino-btns').style.display='none';sfxCasinoSpin();
  const totalSpin=Math.PI*2*6+Math.random()*Math.PI*2;casinoAngle=0;casinoTargetAngle=totalSpin;
  const duration=3000,startTime=Date.now();
  function animSpin(){
    const elapsed=Date.now()-startTime;const progress=Math.min(1,elapsed/duration);
    casinoAngle=casinoTargetAngle*(1-Math.pow(1-progress,3));drawCasinoWheel(casinoAngle);
    if(progress<1){requestAnimationFrame(animSpin)}
    else{
      // Pointer is at top (angle = -PI/2 = 3PI/2 from 0). Wheel rotates by casinoAngle.
      // The segment under the pointer: offset by PI/2 to match top position
      const pointerAngle=((casinoAngle+Math.PI/2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      const segIdx=Math.floor(pointerAngle/(Math.PI*2/10))%10;const resultIsRed=segIdx%2===0;
      const won=(casinoBet==='red'&&resultIsRed)||(casinoBet==='black'&&!resultIsRed);casinoSpinning=false;
      if(won){const w=Math.floor(G.coins);G.coins*=2;document.getElementById('casino-result').textContent=`${resultIsRed?'赤':'黒'}! +${w}G!`;document.getElementById('casino-result').style.color='#44ff44';sfxCasinoWin();document.getElementById('casino-btns').style.display='flex';document.getElementById('casino-bet-info').textContent=`所持金: ${Math.floor(G.coins)} G (ALL IN)`}
      else{document.getElementById('casino-result').textContent=`${resultIsRed?'赤':'黒'}... ハズレ`;document.getElementById('casino-result').style.color='#ff4444';sfxCasinoLose();setTimeout(showDealerGameOver,1500)}
    }
  }
  animSpin();
}

const clock=new THREE.Clock();
let tickTmr=0,alarmTmr=0,prevFloor=0,milestoneNext=100;

function update(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(!G.started){camera.rotation.set(pitch,yaw,0,'YXZ');renderer.render(scene,camera);return}
  if(G.ended&&G.fallPhase===0&&G.clearPhase>=3)return;

  // ESCAPE ANIM
  if(G.clearPhase===2){
    G.clearTimer+=dt;const doorAng=Math.min(G.clearTimer*1.5,Math.PI/2);
    doorPanel.rotation.y=doorAng;doorPanel.position.x=-Math.sin(doorAng)*0.6;doorPanel.position.z=-(1-Math.cos(doorAng))*0.6;
    escLight.intensity=Math.min(G.clearTimer*2,5);
    if(G.clearTimer>1.5)camera.position.x-=1.5*dt;
    scene.background.setRGB(Math.min(1,0.05+G.clearTimer*0.12),Math.min(1,0.05+G.clearTimer*0.12),Math.min(1,0.04+G.clearTimer*0.1));
    scene.fog.density=Math.max(0,0.025-G.clearTimer*0.004);
    yaw+=(Math.PI/2-yaw)*dt*3;pitch+=(0-pitch)*dt*3;
    camera.rotation.set(pitch,yaw,0,'YXZ');updateParticles(dt);renderer.render(scene,camera);
    if(G.clearTimer>4)endGameWin();return;
  }

  // TIMER
  if(!G.ended){
    G.timeRemaining-=dt;
    if(G.timeRemaining<=0){
      G.timeRemaining=0;
      if(!G.continued&&G.totalSpins<G.targetSpins&&G.fallPhase===0){
        G.ended=true;G.fallPhase=1;G.fallTimer=0;G.mode='room';G.pushing=false;
        document.getElementById('roulette-overlay').style.display='none';document.getElementById('shop-overlay').style.display='none';hideNavArrows();
      }else if(G.continued){
        G.ended=true;document.getElementById('roulette-overlay').style.display='none';document.getElementById('shop-overlay').style.display='none';document.getElementById('casino-overlay').style.display='none';hideNavArrows();
        document.getElementById('game-over').style.display='flex';document.getElementById('result-title').textContent='TIME UP';document.getElementById('result-title').style.color='#ccaa22';
        document.getElementById('result-msg').textContent='時間切れ！お疲れ様！';document.getElementById('result-stats').textContent=`${Math.floor(G.totalSpins)} spins / ${Math.floor(G.coins)} G`;return;
      }
    }
  }

  // FALL
  if(G.fallPhase>0){
    G.fallTimer+=dt;const ft=document.getElementById('fall-text');
    if(G.fallPhase===1){ft.innerHTML='時間オーバーだ';ft.style.display='block';yaw+=(0-yaw)*dt*3;pitch+=(0-pitch)*dt*3;camera.rotation.set(pitch,yaw,0,'YXZ');if(G.fallTimer>2.5){G.fallPhase=2;G.fallTimer=0}}
    else if(G.fallPhase===2){ft.style.display='none';const tp=isPortrait()?-Math.PI/4:-Math.PI/3;pitch+=(tp-pitch)*dt*2;camera.rotation.set(pitch,yaw,0,'YXZ');if(G.fallTimer>1.5){G.fallPhase=3;G.fallTimer=0;G.fallVel=0;sfxFall();floor.visible=false}}
    else if(G.fallPhase===3){
      G.fallVel+=9.8*dt;G.fallY-=G.fallVel*dt;camera.position.y=G.fallY;
      pitch+=(-Math.PI/2.5-pitch)*dt*1.5;camera.rotation.set(pitch,yaw+Math.sin(G.fallTimer*8)*0.03,0,'YXZ');
      scene.fog.density=0.025+Math.min(1,G.fallTimer/3)*0.15;
      if(G.fallTimer>3.5){G.fallPhase=0;document.getElementById('game-over').style.display='flex';document.getElementById('result-title').textContent='FALLEN';document.getElementById('result-title').style.color='#cc2222';document.getElementById('result-msg').textContent='奈落に落ちた...';document.getElementById('result-stats').textContent=`${Math.floor(G.totalSpins)} / ${G.targetSpins} spins`;document.getElementById('coin-hud').style.display='none'}
    }
    updateParticles(dt);updateDoorDisp();renderer.render(scene,camera);return;
  }

  // FEVER
  if(G.feverActive){
    G.feverTimer-=dt;
    const fl=document.getElementById('fever-flash');
    fl.style.background=`hsla(${(Date.now()*0.7)%360},80%,40%,0.05)`;fl.style.opacity='1';
    document.getElementById('game-container').classList.add('shake');
    updateFeverCountdown();
    if(G.feverTimer<=0){
      G.feverActive=false;G.feverTimer=0;G.pushing=false;
      fl.style.opacity='0';document.getElementById('game-container').classList.remove('shake');
      pushBtn.classList.remove('fever-active');pushBtn.classList.remove('pressed');
      updatePushBtnText();updateFeverCountdown();
    }
  }

  // ROULETTE PHYSICS
  const mx=G.getMaxSpeed()*(G.feverActive?2:1);
  const acl=G.getAccel();
  // Fever hold mode: accelerate while holding
  if(G.pushing&&G.feverActive){G.rouletteSpeed+=acl*dt;if(G.rouletteSpeed>mx)G.rouletteSpeed=mx;G.lastTapTime=Date.now()}
  // Deceleration: gentle during active tapping, strong when idle
  // While tapping: light friction so taps can build speed
  // After 0.4s idle: ramp up so it stops within ~5s from any speed
  const idleTime=(Date.now()-G.lastTapTime)/1000;
  const tapping=idleTime<0.4;
  // Light decel while tapping (just enough to need continuous tapping)
  // Strong decel when idle: speed*0.8 + 0.2 → exponential-ish decay, stops in ~4s
  const dec=tapping?(0.03*G.rouletteSpeed+0.01):(0.8*G.rouletteSpeed+0.2);
  if(!G.pushing||!G.feverActive){G.rouletteSpeed-=dec*dt;if(G.rouletteSpeed<0)G.rouletteSpeed=0}

  const rotD=G.rouletteSpeed*Math.PI*2*dt;
  G.rouletteAngle+=rotD;G.totalRotation+=Math.abs(rotD);
  const newSpins=G.totalRotation/(Math.PI*2);
  if(newSpins>G.totalSpins){
    const gained=newSpins-G.totalSpins;
    const coinM=G.getCoinMult();
    G.coins+=gained*coinM;G.totalSpins=newSpins;
    const nf=Math.floor(newSpins);
    if(nf>prevFloor){sfxCoin();spawnCoins(wheelGrp.position.clone().add(new THREE.Vector3(0,-0.5,0.5)),2);showCoinPopup(Math.floor(coinM));prevFloor=nf}
    if(G.totalSpins>=milestoneNext){sfxMilestone();spawnCoins(wheelGrp.position.clone().add(new THREE.Vector3(0,0,0.5)),8);milestoneNext=milestoneNext<1000?milestoneNext+100:milestoneNext+1000}
  }

  // WIN
  if(G.totalSpins>=G.targetSpins&&!G.ended&&G.clearPhase===0&&!G.continued){showClearOverlay();return}

  // TICK
  if(G.rouletteSpeed>0.05){tickTmr-=dt;const iv=Math.max(0.04,0.2-G.rouletteSpeed*0.01);if(tickTmr<=0){sfxTick();tickTmr=iv}}

  // VISUALS
  spinner.rotation.z=G.rouletteAngle;
  flickLt.intensity=0.3+Math.random()*0.2;flickLt2.intensity=0.2+Math.random()*0.15;
  if(G.timeRemaining<60&&G.timeRemaining>0&&!G.continued){const p=Math.sin(Date.now()*0.005)*0.3+0.5;mainLt.color.setRGB(0.7+p*0.3,0.25,0.1)}
  updateParticles(dt);

  // Smooth view rotation
  if(G.mode==='room'){
    let d=targetYaw-yaw;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;
    // ~1 second turn: use dt-based lerp (3.0 * dt gives ~1s for 90deg)
    const turnSpeed=3.0*dt;
    yaw+=d*Math.min(turnSpeed,0.15);pitch+=(0-pitch)*Math.min(turnSpeed,0.15);
    if(Math.abs(d)<0.02&&G.viewTransitioning){G.viewTransitioning=false;handleViewAction()}
    camera.rotation.set(pitch,yaw,0,'YXZ');
  }

  updateDoorDisp();updateCoinHUD();updateCountdownDisplay();
  if(G.mode==='roulette'){
    updateGauge();
    const info=document.getElementById('roulette-speed-info');
    const rem=Math.max(0,Math.ceil(G.targetSpins-G.totalSpins));
    info.textContent=G.continued?`Spins: ${Math.floor(G.totalSpins)} | ${Math.floor(G.timeRemaining)}s`:`Spins: ${Math.floor(G.totalSpins)} | Left: ${rem}`;
    if(G.feverActive)info.textContent+=` | FEVER`;
  }
}

function animate(){
  requestAnimationFrame(animate);update();
  if(G.fallPhase>0||G.clearPhase===2)return;
  renderer.render(scene,G.mode==='roulette'?rouletteCam:camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.fov=getFOV();camera.updateProjectionMatrix();
  rouletteCam.aspect=innerWidth/innerHeight;updateRouletteCam();renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
